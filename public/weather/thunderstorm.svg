<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="storm-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="lightning-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Storm Cloud -->
  <path d="M42 66 L94 66 C105 66 114 57 114 46 C114 35.5 106 27 95.5 26.2 C93 12 81 1 66 1 C53 1 42 9.5 38 21.5 C26 23 17 33 17 45 C17 56.5 26.5 66 38 66 Z" 
        fill="url(#storm-cloud)"/>
  <!-- Rain sprinkles -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="32" y1="84" x2="26" y2="98"/>
    <line x1="48" y1="94" x2="42" y2="108"/>
    <line x1="88" y1="84" x2="82" y2="98"/>
    <line x1="102" y1="94" x2="96" y2="108"/>
  </g>
  <!-- Lightning Bolt -->
  <polygon points="68,62 50,86 64,86 56,122 84,80 70,80" 
           fill="url(#lightning-grad)" filter="url(#lightning-glow)"/>
</svg>
