<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9D2"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </radialGradient>
    <filter id="sun-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sun Rays -->
  <g stroke="#FFA500" stroke-width="4.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="12" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="116"/>
    <line x1="12" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="116" y2="64"/>
    <line x1="27.2" y1="27.2" x2="35.7" y2="35.7"/>
    <line x1="92.3" y1="92.3" x2="100.8" y2="100.8"/>
    <line x1="27.2" y1="100.8" x2="35.7" y2="92.3"/>
    <line x1="92.3" y1="35.7" x2="100.8" y2="27.2"/>
  </g>
  <!-- Sun Body -->
  <circle cx="64" cy="64" r="30" fill="url(#sun-grad)" filter="url(#sun-glow)"/>
</svg>
