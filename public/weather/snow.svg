<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="snow-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="snow-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Cloud -->
  <path d="M42 74 L94 74 C105 74 114 65 114 54 C114 43.5 106 35 95.5 34.2 C93 20 81 9 66 9 C53 9 42 17.5 38 29.5 C26 31 17 41 17 53 C17 64.5 26.5 74 38 74 Z" 
        fill="url(#snow-cloud)" filter="url(#snow-shadow)"/>
  <!-- Snowflake symbols -->
  <g stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round">
    <!-- Snowflake 1 -->
    <g transform="translate(42, 92)">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6"/>
      <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6"/>
    </g>
    <!-- Snowflake 2 -->
    <g transform="translate(68, 108)">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6"/>
      <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6"/>
    </g>
    <!-- Snowflake 3 -->
    <g transform="translate(90, 92)">
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="-5.6" y1="-5.6" x2="5.6" y2="5.6"/>
      <line x1="-5.6" y1="5.6" x2="5.6" y2="-5.6"/>
    </g>
  </g>
</svg>
