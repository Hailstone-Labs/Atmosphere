<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="moon-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Stars -->
  <g fill="#FDE68A">
    <circle cx="28" cy="32" r="1.8"/>
    <circle cx="38" cy="78" r="1.5"/>
    <circle cx="98" cy="28" r="2.2"/>
    <circle cx="106" cy="72" r="1.6"/>
    <circle cx="86" cy="102" r="1.4"/>
  </g>
  <!-- Crescent Moon -->
  <path d="M76 24 C50 24 32 46 32 72 C32 96 52 112 76 112 C64 100 58 84 58 68 C58 48 68 34 76 24 Z" 
        fill="url(#moon-grad)" filter="url(#moon-glow)"/>
</svg>
